name: ESLint

on:
  push:
    branches: ["main"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]

jobs:
  eslint:
    name: Run ESLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # eslint.config.mjs imports @eslint/js and globals directly, so install
      # them explicitly (same versions as the local setup in CONTRIBUTING.md).
      - name: Install ESLint
        run: |
          npm install --no-save --package-lock=false \
            eslint@9.7.0 @eslint/js@9.7.0 globals@15

      - name: Run ESLint
        run: npx eslint .
